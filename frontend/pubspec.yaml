name: frontend

description: Agrii AI - Smart Agriculture Application

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # HTTP API
  http: ^1.6.0

  # Localization
  intl: ^0.19.0

  # State Management
  provider: ^6.1.5

  # Navigation
  go_router: ^16.3.0

  # Local Storage
  shared_preferences: ^2.5.3

  # Images
  image_picker: ^1.2.0
  camera: ^0.11.4

  # UI
  flutter_svg: ^2.2.0
  google_fonts: ^6.3.3
  lottie: ^3.3.1
  flutter_spinkit: ^5.2.2

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.3

  # File Picker
  file_picker: ^10.3.2

  # URL Launcher
  url_launcher: ^6.3.2

  # Permissions
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/products/